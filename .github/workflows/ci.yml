name: "Sweepr CI"

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: "License Server (Node 24 + TypeScript + Tests)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js 24
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck server
        run: npx tsc --noEmit

      - name: Run server test suite
        run: npm test

  desktop:
    name: "Desktop App (Tauri v2 + React + Rust)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Linux GTK / WebKit2GTK system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js 24
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca002febbe93a

      - name: Cache Rust cargo artifacts
        uses: Swatinem/rust-cache@ab0b82ab9fa9d4fb5ec1fc7ea1fa50fde0fb1b06
        with:
          workspaces: "app/src-tauri -> target"

      - name: Build frontend bundle
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Cargo check all targets
        working-directory: app/src-tauri
        run: cargo check --all-targets

      - name: Run Rust unit tests
        working-directory: app/src-tauri
        run: cargo test

  android:
    name: "Android App (JDK 17 + Assemble + Lint)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Assemble Debug & Run Android Lint
        run: ./gradlew :app:assembleDebug :app:lintDebug

  ios:
    name: "iOS App (XcodeGen Project Generation)"
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project from project.yml
        run: xcodegen generate
