name: "Build Sweepr Installers"

on:
  workflow_dispatch: # Allows you to click a button in GitHub to manually trigger the build
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'scripts/build-mac-dmg.mjs'
      - '.github/workflows/build-apps.yml'

jobs:
  build-tauri:
    permissions:
      contents: write
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
            targets: ""
          - platform: "windows-latest"
            args: ""
            targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}

      - name: Install Ubuntu dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 file rpm

      - name: Install Frontend Dependencies
        working-directory: ./app
        run: npm ci

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWEEPR_LICENSE_PUBKEY: ${{ secrets.SWEEPR_LICENSE_PUBKEY }}
          SWEEPR_API_URL: ${{ secrets.SWEEPR_API_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: "./app"
          tagName: "v__VERSION__"
          releaseName: "Sweepr v__VERSION__"
          releaseBody: "Automated build of Sweepr installers for Windows, Mac, and Linux."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Package signed macOS UDIF DMG with custom Volume Icon & commit to server/public
        if: matrix.platform == 'macos-latest'
        run: |
          APP_BUNDLE=$(find app/src-tauri/target -name "*.app" -type d | head -n 1)
          if [ -n "$APP_BUNDLE" ]; then
            codesign --force --deep --sign - "$APP_BUNDLE"
            STAGE_DIR=$(mktemp -d)
            cp -R "$APP_BUNDLE" "$STAGE_DIR/"
            ln -s /Applications "$STAGE_DIR/Applications"
            cp app/src-tauri/icons/icon.icns "$STAGE_DIR/.VolumeIcon.icns"
            SetFile -c icnC "$STAGE_DIR/.VolumeIcon.icns" || true
            SetFile -a C "$STAGE_DIR" || true
            hdiutil create -volname "SWEEPR Cleaner" -srcfolder "$STAGE_DIR" -ov -format UDZO server/public/SWEEPRCleaner.dmg
            if [ "${{ github.ref_name }}" = "main" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add server/public/SWEEPRCleaner.dmg
              if ! git diff --staged --quiet; then
                git commit -m "chore(mac): update native Universal UDIF SWEEPRCleaner.dmg with icon [skip ci]"
                git pull --rebase origin main || true
                git push origin HEAD:main || true
              fi
            fi
          fi

      - name: Sign Windows Binaries with Azure Artifact Signing (Authenticode + SmartScreen)
        if: matrix.platform == 'windows-latest' && env.AZURE_CLIENT_ID != ''
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        uses: azure/artifact-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          artifact-signing-account-name: sweepr-signing
          certificate-profile-name: sweepr-prod-profile
          files-folder: ${{ github.workspace }}/app/src-tauri/target/release
          files-folder-filter: exe,msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
