name: "Build Sweepr Installers"

on:
  workflow_dispatch: # Allows you to click a button in GitHub to manually trigger the build
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/build-apps.yml'

jobs:
  build-tauri:
    permissions:
      contents: write
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
            targets: ""
          - platform: "windows-latest"
            args: ""
            targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: "24"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}

      - name: Install Ubuntu dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 file rpm

      - name: Install Frontend Dependencies
        working-directory: ./app
        run: npm ci

      - name: Build Tauri App (inner SWEEPRCleaner.exe signed via tauri.conf.json bundle.windows.signCommand before NSIS/MSI packaging)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWEEPR_LICENSE_PUBKEY: ${{ secrets.SWEEPR_LICENSE_PUBKEY }}
          SWEEPR_API_URL: ${{ secrets.SWEEPR_API_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SWEEPR_CERT_THUMBPRINT: ${{ secrets.SWEEPR_CERT_THUMBPRINT }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          projectPath: "./app"
          tagName: "v__VERSION__"
          releaseName: "Sweepr v__VERSION__"
          releaseBody: "Automated build of Sweepr installers for Windows, Mac, and Linux."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Package signed macOS Universal UDIF DMG from Rust/Tauri binary & commit to server/public
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP_BUNDLE=$(find app/src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "Error: Universal macOS .app bundle not found in target/universal-apple-darwin/release/bundle/macos" >&2
            exit 1
          fi
          MACHO_BIN=$(find "$APP_BUNDLE/Contents/MacOS" -maxdepth 1 -type f | head -n 1)
          if [ -z "$MACHO_BIN" ] || ! file "$MACHO_BIN" | grep -q "Mach-O"; then
            echo "Error: Expected compiled Rust/Tauri Mach-O executable inside $APP_BUNDLE/Contents/MacOS" >&2
            exit 1
          fi
          lipo -info "$MACHO_BIN"
          SIGN_ID="${APPLE_SIGNING_IDENTITY:--}"
          codesign --force --deep --options runtime --sign "$SIGN_ID" "$APP_BUNDLE"
          STAGE_DIR=$(mktemp -d)
          cp -R "$APP_BUNDLE" "$STAGE_DIR/"
          ln -s /Applications "$STAGE_DIR/Applications"
          cp app/src-tauri/icons/icon.icns "$STAGE_DIR/.VolumeIcon.icns"
          SetFile -c icnC "$STAGE_DIR/.VolumeIcon.icns" || true
          SetFile -a C "$STAGE_DIR" || true
          hdiutil create -volname "SWEEPR Cleaner" -srcfolder "$STAGE_DIR" -ov -format UDZO server/public/SWEEPRCleaner.dmg
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add server/public/SWEEPRCleaner.dmg
            if ! git diff --staged --quiet; then
              git commit -m "chore(mac): update native Universal UDIF SWEEPRCleaner.dmg with icon [skip ci]"
              git pull --rebase origin main || true
              git push origin HEAD:main || true
            fi
          fi

      - name: Check Azure Signing Configuration
        id: azure-check
        if: matrix.platform == 'windows-latest'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_ID)) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Sign Windows Binaries with Azure Artifact Signing (Authenticode + SmartScreen)
        if: matrix.platform == 'windows-latest' && steps.azure-check.outputs.enabled == 'true'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        uses: azure/artifact-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          artifact-signing-account-name: sweepr-signing
          certificate-profile-name: sweepr-prod-profile
          files-folder: ${{ github.workspace }}/app/src-tauri/target/release
          files-folder-filter: exe,msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload Signed Windows Binaries to GitHub Release
        if: matrix.platform == 'windows-latest' && steps.azure-check.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tauriVersion = (Get-Content "app/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $signedInstallers = Get-ChildItem -Path "app/src-tauri/target/release/bundle" -Recurse -Include *.exe,*.msi | Select-Object -ExpandProperty FullName
          if ($signedInstallers) {
            gh release upload "v$tauriVersion" $signedInstallers --clobber
          }
