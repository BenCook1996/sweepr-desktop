name: "Build Sweepr Installers"

on:
  workflow_dispatch: # Allows you to click a button in GitHub to manually trigger the build

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: ""
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - name: Install Ubuntu dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Frontend Dependencies
        working-directory: ./app
        run: npm ci

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWEEPR_LICENSE_PUBKEY: ${{ secrets.SWEEPR_LICENSE_PUBKEY }}
          SWEEPR_API_URL: ${{ secrets.SWEEPR_API_URL }}
        with:
          projectPath: "./app"
          tagName: "v__VERSION__"
          releaseName: "Sweepr v__VERSION__"
          releaseBody: "Automated build of Sweepr installers for Windows, Mac, and Linux."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
