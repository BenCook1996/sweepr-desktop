name: "A5 Release Syndication (PAD XML, Winget, Chocolatey & Listing Audit)"

on:
  release:
    types: [published]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: false
        default: "0.1.0"

jobs:
  syndicate-release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
      CRM_ADMIN_PASSWORD: ${{ secrets.CRM_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Update PAD XML, Winget Manifests & Chocolatey Checksums
        id: sync
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          $ver = "$env:INPUT_VERSION"
          if ([string]::IsNullOrWhiteSpace($ver) -and -not [string]::IsNullOrWhiteSpace($env:RELEASE_TAG_NAME)) {
            $ver = $env:RELEASE_TAG_NAME.TrimStart("v")
          }
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $tauriConf = Get-Content "app/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
            $ver = $tauriConf.version
          }
          if ($ver -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Invalid semantic version: $ver"
          }
          node server/scripts/update-release-listings.mjs "--version=$ver"
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Commit Updated PAD XML & Package Manifests
        shell: pwsh
        env:
          SYNC_VERSION: ${{ steps.sync.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add server/public/pad.xml chocolatey/ winget-manifests/
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore(release): sync PAD XML, Winget & Chocolatey manifests for v$env:SYNC_VERSION [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          }

      - name: Submit Winget Manifest via wingetcreate (when WINGET_TOKEN is configured)
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        env:
          SYNC_VERSION: ${{ steps.sync.outputs.version }}
        run: |
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update SWEEPR.Cleaner --version "$env:SYNC_VERSION" --urls "https://sweeprcleaner.com/SWEEPRCleaner.exe" "https://sweeprcleaner.com/Sweepr_Setup.msi" --token $env:WINGET_TOKEN --submit

      - name: Pack & Push Chocolatey Package (when CHOCOLATEY_API_KEY is configured)
        if: env.CHOCOLATEY_API_KEY != ''
        shell: pwsh
        working-directory: ./chocolatey
        env:
          SYNC_VERSION: ${{ steps.sync.outputs.version }}
        run: |
          choco pack sweepr-cleaner.nuspec
          choco push "sweepr-cleaner.$env:SYNC_VERSION.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY

      - name: Trigger Weekly / Post-Release Listing Freshness Audit on Production CRM
        if: env.CRM_ADMIN_PASSWORD != ''
        shell: pwsh
        env:
          SYNC_VERSION: ${{ steps.sync.outputs.version }}
        run: |
          $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("admin:$env:CRM_ADMIN_PASSWORD"))
          $headers = @{
            "Authorization" = "Basic $b64"
            "Origin"        = "https://sweeprcleaner.com"
            "Content-Type"  = "application/json"
          }
          $body = @{ expected_version = "$env:SYNC_VERSION" } | ConvertTo-Json
          $res = Invoke-RestMethod -Method Post -Uri "https://sweeprcleaner.com/api/crm/seo/listings/check" -Headers $headers -Body $body
          Write-Host "Listing audit: checked=$($res.checked), current=$($res.current_count), stale=$($res.stale_count), open_tasks=$($res.open_crm_tasks)"
