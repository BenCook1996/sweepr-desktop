name: "Cloud CMO, Google Search Console, PageSpeed & Product Automations (A1-A21)"

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      batch_count:
        description: "Number of canonical pSEO pages to generate via keyword research engine (0 = frozen during Core Update stabilization)"
        required: false
        default: "0"
      run_weekly_product_advisor:
        description: "Force-generate the A20 Weekly Content-to-Product & UI Mockup Advisory"
        required: false
        default: "true"

jobs:
  cmo-automations:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CRM_ADMIN_PASSWORD: ${{ secrets.CRM_ADMIN_PASSWORD }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON || secrets.GCP_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL || 'sc-domain:sweeprcleaner.com' }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      ALLOW_LIVE_INDEXNOW: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Run Unified Cloud Automation Runner (A21 Google Cloud GSC + Drip + 100/100 Audit + A20 Advisor)
        working-directory: ./server
        env:
          INPUT_BATCH_COUNT: ${{ github.event.inputs.batch_count || '0' }}
          INPUT_RUN_ADVISOR: ${{ github.event.inputs.run_weekly_product_advisor || 'false' }}
        run: |
          COUNT=$(printf "%s" "$INPUT_BATCH_COUNT" | tr -cd '0-9')
          COUNT="${COUNT:-0}"
          SKIP_DRIP=""
          if [ "$COUNT" = "0" ]; then
            SKIP_DRIP="--skip-drip"
          fi
          FORCE_WEEKLY=""
          if [ "$(date -u +%u)" = "1" ] || [ "$INPUT_RUN_ADVISOR" = "true" ]; then
            FORCE_WEEKLY="--force-weekly"
          fi
          npx tsx scripts/cloud-automation-runner.ts --count="$COUNT" $SKIP_DRIP --submit-sitemap --update-log $FORCE_WEEKLY

      - name: Commit Cloud SEO Artifacts, GSC Seed, Audit Log & Product Mockups (if changed)
        env:
          INPUT_BATCH_COUNT: ${{ github.event.inputs.batch_count || '0' }}
          INPUT_RUN_ADVISOR: ${{ github.event.inputs.run_weekly_product_advisor || 'false' }}
        run: |
          COUNT=$(printf "%s" "$INPUT_BATCH_COUNT" | tr -cd '0-9')
          COUNT="${COUNT:-0}"
          IS_MONDAY=$([ "$(date -u +%u)" = "1" ] && echo "1" || echo "0")
          RUN_WEEKLY="$INPUT_RUN_ADVISOR"
          if [ "$COUNT" = "0" ] && [ "$IS_MONDAY" = "0" ] && [ "$RUN_WEEKLY" != "true" ]; then
            echo "Skipping daily git commit/push while pSEO batch_count=0 during Core Update stabilization (GSC ingest continues via HTTPS below)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in server/src/data/gsc-seed.json server/src/data/clean-items.json server/src/data/keyword-research-report.json server/src/data/seo-strategy-ledger.json server/src/data/daily-seo-pages-state.json server/src/data/indexing-queue.json server/src/data/weekly-product-advisor-report.json server/public/crm/weekly-product-mockups.html WEEKLY_PRODUCT_CONTENT_ADVISORY.md TECHNICAL_SEO_AUDIT_LOG.md SEO_CHANGELOG.md server/public/sitemap.xml server/public/llms.txt; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if ! git diff --staged --quiet; then
            git commit -m "chore(cloud-seo): automated Google Cloud GSC sync, pillar content & audit log [skip ci]"
            git pull --rebase -X ours origin main
            git push origin HEAD:main
          fi

      - name: Sync Cleaner & Central CRM GSC, Weekly Live Audits & Endpoint Health
        if: env.CRM_ADMIN_PASSWORD != ''
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          B64=$(printf "admin:%s" "$CRM_ADMIN_PASSWORD" | base64 -w 0)

          echo "### 1. Sweepr Cleaner Production GSC Sync" >> "$GITHUB_STEP_SUMMARY"
          CLOUD_RESP=$(curl -sS -w "\n%{http_code}" -X POST "https://sweeprcleaner.com/api/crm/seo/gsc/cloud-sync" \
            -H "Authorization: Basic $B64" \
            -H "Origin: https://sweeprcleaner.com" \
            -H "Content-Type: application/json" \
            -d '{"days":90,"max_inspect_urls":6,"run_cwv":true,"submit_sitemap":true}')
          CLOUD_CODE=$(printf "%s" "$CLOUD_RESP" | tail -n1)
          CLOUD_BODY=$(printf "%s" "$CLOUD_RESP" | sed '$d')
          echo "Cleaner cloud-sync HTTP $CLOUD_CODE: $CLOUD_BODY"
          echo "- Cleaner \`/gsc/cloud-sync\`: HTTP $CLOUD_CODE" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CLOUD_CODE" -lt 200 ] || [ "$CLOUD_CODE" -ge 300 ]; then
            echo "::error::Cleaner /api/crm/seo/gsc/cloud-sync returned HTTP $CLOUD_CODE"
            exit 1
          fi

          GSC_LIVE=$(printf "%s" "$CLOUD_BODY" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{const j=JSON.parse(d);console.log(Boolean(j.gsc_synced_live||j?.summary?.gsc_synced_live));}catch{console.log("false")}});')
          if [ "$GSC_LIVE" != "true" ] && [ -f server/src/data/gsc-seed.json ]; then
            INGEST_RESP=$(curl -sS -w "\n%{http_code}" -X POST "https://sweeprcleaner.com/api/crm/seo/gsc/ingest" \
              -H "Authorization: Basic $B64" \
              -H "Origin: https://sweeprcleaner.com" \
              -H "Content-Type: application/json" \
              --data-binary @server/src/data/gsc-seed.json)
            INGEST_CODE=$(printf "%s" "$INGEST_RESP" | tail -n1)
            echo "Fallback seed ingest HTTP $INGEST_CODE"
            if [ "$INGEST_CODE" -lt 200 ] || [ "$INGEST_CODE" -ge 300 ]; then
              echo "::error::Cleaner /api/crm/seo/gsc/ingest returned HTTP $INGEST_CODE"
              exit 1
            fi
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '### 2. Central CRM Free Sync ($0.00 DataForSEO Spend)' >> "$GITHUB_STEP_SUMMARY"
          for proj in cleaner vpn deepblock; do
            CRM_GSC_RESP=$(curl -sS -w "\n%{http_code}" -X POST "https://sweepr-crm-production.up.railway.app/api/crm/seo/gsc/sync?project=$proj&wait=1" \
              -H "Authorization: Basic $B64" \
              -H "Origin: https://sweepr-crm-production.up.railway.app" \
              -H "Content-Type: application/json" \
              -d '{"days":90}')
            CRM_GSC_CODE=$(printf "%s" "$CRM_GSC_RESP" | tail -n1)
            CRM_GSC_BODY=$(printf "%s" "$CRM_GSC_RESP" | sed '$d')
            echo "Central CRM GSC sync [$proj] HTTP $CRM_GSC_CODE: $CRM_GSC_BODY"
            if [ "$CRM_GSC_CODE" -lt 200 ] || [ "$CRM_GSC_CODE" -ge 300 ]; then
              echo "::warning::Central CRM GSC sync [$proj] returned HTTP $CRM_GSC_CODE"
              echo "- [$proj] GSC sync: **HTTP $CRM_GSC_CODE**" >> "$GITHUB_STEP_SUMMARY"
            else
              ROWS=$(printf "%s" "$CRM_GSC_BODY" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{const j=JSON.parse(d);console.log(j?.job?.result?.rows ?? j?.rows ?? "ok");}catch{console.log("ok")}});')
              echo "- [$proj] GSC sync: HTTP $CRM_GSC_CODE (rows=$ROWS)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          IS_MONDAY=$([ "$(date -u +%u)" = "1" ] && echo "1" || echo "0")
          if [ "$IS_MONDAY" = "1" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### 3. Central CRM Weekly Live Site Audits" >> "$GITHUB_STEP_SUMMARY"
            for proj in cleaner vpn deepblock; do
              AUD_RESP=$(curl -sS -w "\n%{http_code}" -X POST "https://sweepr-crm-production.up.railway.app/api/crm/seo/audit/run?project=$proj&wait=1" \
                -H "Authorization: Basic $B64" \
                -H "Origin: https://sweepr-crm-production.up.railway.app" \
                -H "Content-Type: application/json" \
                -d '{"source":"live","max_pages":150}')
              AUD_CODE=$(printf "%s" "$AUD_RESP" | tail -n1)
              AUD_BODY=$(printf "%s" "$AUD_RESP" | sed '$d')
              echo "Central CRM audit [$proj] HTTP $AUD_CODE: $AUD_BODY"
              if [ "$AUD_CODE" -ge 200 ] && [ "$AUD_CODE" -lt 300 ]; then
                LINE=$(printf "%s" "$AUD_BODY" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{const r=JSON.parse(d)?.job?.result||{};const s=Number(r.health_score??0);const e=Number(r.errors??0);const p=Number(r.pages??0);console.log(JSON.stringify({s,e,p}));}catch{console.log("{\"s\":0,\"e\":1,\"p\":0}");}});')
                HS=$(printf "%s" "$LINE" | node -e 'const j=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(j.s)')
                ERR=$(printf "%s" "$LINE" | node -e 'const j=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(j.e)')
                PG=$(printf "%s" "$LINE" | node -e 'const j=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(j.p)')
                echo "- [$proj] Live audit: **${HS}/100** (${PG} pages, ${ERR} errors)" >> "$GITHUB_STEP_SUMMARY"
                if [ "$ERR" -gt 0 ] || [ "$HS" -lt 98 ]; then
                  echo "::warning::[$proj] Live audit alert: health_score=$HS, errors=$ERR"
                fi
              else
                echo "::warning::[$proj] Live audit HTTP $AUD_CODE"
                echo "- [$proj] Live audit: **HTTP $AUD_CODE**" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 4. Production Endpoint & Bot Crawl-Error Watch" >> "$GITHUB_STEP_SUMMARY"
          for route in "/" "/sitemap.xml" "/robots.txt" "/llms.txt" "/pad.xml"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://sweeprcleaner.com$route")
            echo "- \`GET $route\`: HTTP $CODE" >> "$GITHUB_STEP_SUMMARY"
            if [ "$CODE" != "200" ]; then
              echo "::error::Production route $route returned HTTP $CODE"
              exit 1
            fi
          done
          EXE_CODE=$(curl -sI -o /dev/null -w "%{http_code}" "https://sweeprcleaner.com/SWEEPRCleaner.exe")
          echo "- \`HEAD /SWEEPRCleaner.exe\`: HTTP $EXE_CODE" >> "$GITHUB_STEP_SUMMARY"
          if [ "$EXE_CODE" != "200" ]; then
            echo "::error::HEAD /SWEEPRCleaner.exe returned HTTP $EXE_CODE"
            exit 1
          fi

          BOTS_JSON=$(curl -sS "https://sweepr-crm-production.up.railway.app/api/crm/seo/bots?project=cleaner&days=7" \
            -H "Authorization: Basic $B64" || echo "{}")
          printf "%s" "$BOTS_JSON" | node -e '
            let d = "";
            process.stdin.on("data", c => d += c);
            process.stdin.on("end", () => {
              try {
                const j = JSON.parse(d);
                const rows = Array.isArray(j.by_bot) ? j.by_bot : [];
                const bad = rows.filter(r => Number(r.errors || 0) > 0);
                if (bad.length === 0) {
                  console.log("- 7d Bot Crawl Errors: 0 errors across all search/AI bots");
                } else {
                  for (const b of bad) {
                    console.log(`- **${b.bot}**: ${b.errors} error(s) out of ${b.hits} hits (last_seen=${b.last_seen})`);
                    if (/Googlebot|Bingbot|OAI-SearchBot|PerplexityBot|ClaudeBot/i.test(String(b.bot))) {
                      console.error(`::warning::Priority crawler ${b.bot} hit ${b.errors} HTTP error(s) on cleaner in the past 7d`);
                    }
                  }
                }
              } catch (e) {
                console.log("- Could not parse Central CRM bot telemetry");
              }
            });
          ' >> "$GITHUB_STEP_SUMMARY"
