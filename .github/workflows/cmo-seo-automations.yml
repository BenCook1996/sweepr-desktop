name: "Cloud CMO, Google Search Console, PageSpeed & Product Automations (A1-A21)"

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      batch_count:
        description: "Number of canonical pSEO pages to generate via keyword research engine (0 = frozen during Core Update stabilization)"
        required: false
        default: "0"
      run_weekly_product_advisor:
        description: "Force-generate the A20 Weekly Content-to-Product & UI Mockup Advisory"
        required: false
        default: "true"

jobs:
  cmo-automations:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CRM_ADMIN_PASSWORD: ${{ secrets.CRM_ADMIN_PASSWORD }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL || 'sc-domain:sweeprcleaner.com' }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OPEN_PAGERANK_API_KEY: ${{ secrets.OPEN_PAGERANK_API_KEY }}
      DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
      DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Run Unified Cloud Automation Runner (A21 Google Cloud GSC + Drip + 100/100 Audit + A20 Advisor)
        working-directory: ./server
        run: |
          COUNT="${{ github.event.inputs.batch_count || '0' }}"
          SKIP_DRIP=""
          if [ "$COUNT" = "0" ]; then
            SKIP_DRIP="--skip-drip"
          fi
          FORCE_WEEKLY=""
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event.inputs.run_weekly_product_advisor || 'false' }}" = "true" ]; then
            FORCE_WEEKLY="--force-weekly"
          fi
          npx tsx scripts/cloud-automation-runner.ts --count="$COUNT" $SKIP_DRIP --update-log $FORCE_WEEKLY

      - name: Commit Cloud SEO Artifacts, GSC Seed, Audit Log & Product Mockups (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in server/src/data/gsc-seed.json server/src/data/clean-items.json server/src/data/keyword-research-report.json server/src/data/seo-strategy-ledger.json server/src/data/daily-seo-pages-state.json server/src/data/indexing-queue.json server/src/data/weekly-product-advisor-report.json server/public/crm/weekly-product-mockups.html WEEKLY_PRODUCT_CONTENT_ADVISORY.md TECHNICAL_SEO_AUDIT_LOG.md server/public/sitemap.xml server/public/llms.txt; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if ! git diff --staged --quiet; then
            git commit -m "chore(cloud-seo): automated Google Cloud GSC sync, pillar content & audit log [skip ci]"
            git pull --rebase -X ours origin main
            git push origin HEAD:main
          fi

      - name: Sync GSC Data & Trigger Production Railway Automations (A1-A21)
        if: env.CRM_ADMIN_PASSWORD != ''
        run: |
          B64=$(printf "admin:%s" "$CRM_ADMIN_PASSWORD" | base64 -w 0)
          curl -fsSL -X POST "https://sweeprcleaner.com/api/crm/seo/gsc/cloud-sync" \
            -H "Authorization: Basic $B64" \
            -H "Origin: https://sweeprcleaner.com" \
            -H "Content-Type: application/json" \
            -d '{"days":90,"max_inspect_urls":6,"run_cwv":true,"submit_sitemap":false}' || true
          if [ -f server/src/data/gsc-seed.json ]; then
            curl -fsSL -X POST "https://sweeprcleaner.com/api/crm/seo/gsc/ingest" \
              -H "Authorization: Basic $B64" \
              -H "Origin: https://sweeprcleaner.com" \
              -H "Content-Type: application/json" \
              --data-binary @server/src/data/gsc-seed.json || true
          fi
          curl -fsSL -X POST "https://sweeprcleaner.com/api/crm/automations/run" \
            -H "Authorization: Basic $B64" \
            -H "Origin: https://sweeprcleaner.com" \
            -H "Content-Type: application/json" \
            -d '{"id":"all"}' || true
