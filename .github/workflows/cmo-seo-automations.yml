name: "CMO SEO, Keyword Research, PageSpeed & Lifecycle Automations (A1-A15)"

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      batch_count:
        description: "Number of pSEO pages to generate via keyword research engine"
        required: false
        default: "20"

jobs:
  cmo-automations:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CRM_ADMIN_PASSWORD: ${{ secrets.CRM_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Run Automated Keyword Research & pSEO Generation
        working-directory: ./server
        run: |
          COUNT="${{ github.event.inputs.batch_count || '20' }}"
          node scripts/daily-50-seo-pages.mjs --count="$COUNT"

      - name: Run 100/100 SEO, PageSpeed & GEO Audit Gate
        working-directory: ./server
        run: npx tsx scripts/daily-seo-pagespeed-audit.ts

      - name: Commit New pSEO Pages, Strategy Ledger & Updated GEO Index (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add server/src/data/clean-items.json server/src/data/keyword-research-report.json server/src/data/seo-strategy-ledger.json server/public/llms.txt
          if ! git diff --staged --quiet; then
            git commit -m "chore(seo): automated keyword research, competitor teardown & strategy ledger sync [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Trigger Production CRM Automations (A1-A17)
        if: env.CRM_ADMIN_PASSWORD != ''
        run: |
          B64=$(printf "admin:%s" "$CRM_ADMIN_PASSWORD" | base64 -w 0)
          curl -fsSL -X POST "https://sweeprcleaner.com/api/crm/automations/run" \
            -H "Authorization: Basic $B64" \
            -H "Origin: https://sweeprcleaner.com" \
            -H "Content-Type: application/json" \
            -d '{"id":"all"}'
