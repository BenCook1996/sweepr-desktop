name: Sweepr
options:
  bundleIdPrefix: com.sweepr
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    from: 5.0.0
targets:
  Sweepr:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Sources]
    dependencies:
      - package: RevenueCat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sweepr.app
        MARKETING_VERSION: "1.0.4"
        CURRENT_PROJECT_VERSION: "5"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "SWEEPR Cleaner"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSFaceIDUsageDescription: "SWEEPR uses Face ID to unlock your encrypted Private Lockbox."
        NSPhotoLibraryUsageDescription: "SWEEPR Cleaner analyzes your library on-device to group duplicates, similar shots, screenshots, and large videos so you can reclaim storage space."
        NSPhotoLibraryAddUsageDescription: "SWEEPR Cleaner saves compressed videos and optimized photos back to your photo library."
        NSContactsUsageDescription: "SWEEPR Cleaner scans your contacts locally on-device to find duplicate and incomplete entries and merge them safely."
        NSCalendarsUsageDescription: "SWEEPR Cleaner scans your calendar locally on-device to find and remove expired non-recurring events older than 1 year."
        NSCalendarsFullAccessUsageDescription: "SWEEPR Cleaner scans your calendar locally on-device to find and remove expired non-recurring events older than 1 year."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # RevenueCat public SDK key (appl_...). Supply REVENUECAT_API_KEY as a build setting
        # (e.g. an uncommitted Secrets.xcconfig); read at launch in SweeprApp.swift.
        REVENUECAT_API_KEY: "$(REVENUECAT_API_KEY)"
        SWEEPR_WEBSITE_URL: "https://sweeprcleaner.com"
        SWEEPR_SUPPORT_EMAIL: "support@sweeprcleaner.com"
        SWEEPR_API_URL: "https://sweeprcleaner.com"

