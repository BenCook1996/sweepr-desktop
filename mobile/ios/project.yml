name: Sweepr
options:
  bundleIdPrefix: com.sweepr
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    from: 5.0.0
targets:
  Sweepr:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Sources]
    dependencies:
      - package: RevenueCat
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "SWEEPR Cleaner"
        UILaunchStoryboardName: LaunchScreen
        NSPhotoLibraryUsageDescription: "SWEEPR Cleaner analyzes your library on-device to group duplicates, similar shots, screenshots, and large videos so you can reclaim storage space."
        NSPhotoLibraryAddUsageDescription: "SWEEPR Cleaner saves compressed videos back to your photo library after hardware compression."
        NSContactsUsageDescription: "SWEEPR Cleaner scans your contacts locally on-device to find duplicate and incomplete entries and merge them safely."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # RevenueCat public SDK key (appl_...). Supply REVENUECAT_API_KEY as a build setting
        # (e.g. an uncommitted Secrets.xcconfig); read at launch in SweeprApp.swift.
        REVENUECAT_API_KEY: "$(REVENUECAT_API_KEY)"
        SWEEPR_WEBSITE_URL: "https://sweepr.app"
        SWEEPR_SUPPORT_EMAIL: "support@sweepr.app"
        SWEEPR_API_URL: "https://api.sweepr.app"

